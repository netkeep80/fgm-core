format: repo-guard/requirement-v1
id: FGMC-GEOM-001
normative: "### FGMC-GEOM-001 — Композиция FGM должна различать точные операции формы, явное сглаживание и разрешение перекрытий материалов. Сглаживание должно сохранять точную форму вне разрешённой области и в защищённой области. В активной части общего объёма материал должен выбираться по явному числовому приоритету с устойчивым разрешением равенства независимо от камеры, чанка и порядка обхода. Наложение должно сохранять вклады для повторной выборки после снятия одного из них. Замещение должно выражаться явной операцией формы. Выбор материала сам по себе должен сохранять поле формы и отдельно заданное правило коллизии. Синтетические проверки должны покрывать острый угол, сквозной вырез, разрешённое сглаживание, защищённую область, перекрытие и удаление вклада."
