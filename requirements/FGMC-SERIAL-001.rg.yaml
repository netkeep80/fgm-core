format: repo-guard/requirement-v1
id: FGMC-SERIAL-001
normative: "### FGMC-SERIAL-001 — Пакет FGM должен иметь явные версии формата и семантики интерпретатора и каноническую запись в UTF-8. Повторное чтение и запись должны сохранять форму, материалы, сохранённое семя и идентичность. Хеш модели должен зависеть от её семантических входов, а идентичность пакета должна дополнительно учитывать версию генератора, идентификаторы и хеши ресурсов и параметры генерации. Семя заданного назначения должно воспроизводиться по тем же явным входам. Неоднозначные записи, неподдерживаемые версии и неизвестные обязательные узлы должны отклоняться. Исполняемые проверки должны сравнивать канонические байты и хеши с синтетическим эталоном и подтверждать семантическую выборку после повторной записи."
