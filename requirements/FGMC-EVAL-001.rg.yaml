format: repo-guard/requirement-v1
id: FGMC-EVAL-001
normative: "### FGMC-EVAL-001 — Эталонный CPU-исполнитель C++20 должен загружать пакет FGM, проверять версии, обязательные поля, ссылки и типы узлов и вычислять поле и семантический материал по контрактам C01–C04. Он должен предоставлять локальную и мировую выборки с однозначными числовыми и диагностическими правилами. Для одного снимка результат должен быть независим от порядка запросов и параметров камеры. Автономные тесты должны проверять примитивы, операции над формой, границы, материалы, преобразования и отказы без браузера и GPU."
