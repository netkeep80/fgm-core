format: repo-guard/requirement-v1
id: FGMC-LANG-001
normative: "### FGMC-LANG-001 — Спецификация FGM-0 должна задавать версию программы, типы узлов, правила ссылок и явные привязки параметров и объёмных полей. Она должна определять точечную выборку в единицах модели и коды ошибок для недопустимых программ. Значение поля и семантический материал в фиксированной точке должны зависеть только от программы и её явных входов. Синтетическая проверка должна исполнять не менее пяти допустимых и пяти недопустимых примеров с заранее указанным результатом выборки или кодом отказа."
