format: repo-guard/requirement-v1
id: FGMC-VIS-001
normative: "### FGMC-VIS-001 — Семантическая модель FGM и визуальный профиль должны иметь отдельные входы и идентичность. Профиль должен задаваться версией алгоритма, параметрами и семенем при его использовании. При фиксированных семантических входах и локальной точке смена профиля, камеры, разрешения или детализации должна сохранять выборку формы и семантического материала, а также авторитетные игровые свойства. Синтетическая проверка должна сравнить два профиля одного объекта, воспроизвести профиль после повторной загрузки и показать изменение результата при изменении соответствующего семантического или визуального входа."
