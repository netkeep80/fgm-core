format: repo-guard/requirement-v1
id: FGMC-SPACE-001
normative: "### FGMC-SPACE-001 — Спецификация координат FGM должна задавать правосторонние пространства экземпляра и мира, единицы и обратимые преобразования переноса, поворота и равномерного масштаба. Она должна определять адреса вложенных кубов и чанков, владельца точки и единый точный адрес общей двоичной точки для соседних кубов, включая разные уровни. Результат выборки содержимого экземпляра в одной точке при фиксированном снимке входов должен совпадать для всех адресующих её кубов, уровней и чанков. Грани кубов задают границы областей выборки. Отображение содержимого и игровые коллизии определяются потребителями. Исполняемые синтетические проверки должны покрывать преобразования, общие точки, границы чанков и выборку одного объекта из смежных кубов."
lifecycle:
  accepted: false
  current: false
  published: false
