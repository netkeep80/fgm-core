name: RepoGuard 6.0.1

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  repo-guard:
    name: RepoGuard exact BASE/HEAD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js for documentation tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify document-language checker, including negative tests
        run: node --test tests/document-language.test.mjs
      - name: Verify Russian documentation at exact HEAD
        run: node scripts/check-document-language.mjs
      - name: Проверить исполняемые примеры FGM-0
        run: node --test tests/fgm-0.test.mjs
      - name: Проверить координаты и адресацию FGM
        run: node --test tests/fgm-space.test.mjs
      - name: Проверить независимость семантики FGM от визуального профиля
        run: node --test tests/fgm-visual.test.mjs
      - name: Проверить композицию формы и материалов FGM
        run: node --test tests/fgm-geometry.test.mjs
      - name: Проверить каноническую запись и идентичность FGM
        run: node --test tests/fgm-serialization.test.mjs
      - name: Собрать CPU-исполнитель C++20 и проверить выборку
        run: |
          cmake -S . -B "$RUNNER_TEMP/fgm-cpu" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/fgm-cpu" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/fgm-cpu" --output-on-failure
      - name: RepoGuard exact snapshot transition
        uses: netkeep80/repo-guard@74db97791e6da8a75287164f0d0b41579108f114
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          node-version: '24'
